[project]
name = "sameperson"
version = "0.1.0"
description = "Patient matching that reports its two errors separately, in people."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Musharraf Shaikh" }]
keywords = ["patient-matching", "record-linkage", "fhir", "health-data",
            "interoperability", "data-quality"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
sameperson = "sameperson.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
